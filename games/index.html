*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#dcecf3;color:#2f3b40;font:17px/1.45 'Fredoka',system-ui,sans-serif;padding:24px 16px}
form{background:#fff;border-radius:18px;padding:24px;max-width:380px;width:100%;display:flex;flex-direction:column;gap:12px;box-shadow:0 3px 0 rgba(0,0,0,.08)}

label{font-weight:500}
input[type=password],input[type=text]{width:100%;font:inherit;font-size:18px;padding:10px 12px;border:2px solid #cfe3ea;border-radius:10px}
input:focus-visible,button:focus-visible{outline:3px solid #ffb300;outline-offset:2px}
.row{display:flex;gap:8px;align-items:center;font-size:15px;color:#5d6d73;font-weight:400}
button{font:inherit;font-weight:500;border:0;border-radius:10px;padding:12px;background:#2f8ea5;color:#fff;cursor:pointer;font-size:18px}
button:disabled{opacity:.6}
.err{color:#c2414f;min-height:1.4em}
</style>

<body>
<form id="f">
  <h1>🎮 Games</h1>
  <p>These games are for Jelena's students. Enter the password from your teacher.</p>
  <label for="pw">Password</label>
  <input type="password" id="pw" autocomplete="current-password" autofocus required>
  <label class="row"><input type="checkbox" id="show"> Show password</label>
  <label class="row"><input type="checkbox" id="remember"> Remember me on this device</label>
  <button id="go">Open</button>
  <p class="err" id="err" aria-live="polite"></p>
</form>

const K="ewj-games-pw";
const b=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function unlock(pw){
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b(DATA.s),iterations:600000,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
  const plain=await crypto.subtle.decrypt({name:"AES-GCM",iv:b(DATA.i)},key,b(DATA.d));
  return new TextDecoder().decode(plain);
}
function open(html){document.open();document.write(html);document.close();}
const f=document.getElementById("f"),pw=document.getElementById("pw"),err=document.getElementById("err"),go=document.getElementById("go");
document.getElementById("show").addEventListener("change",e=>pw.type=e.target.checked?"text":"password");
f.addEventListener("submit",async e=>{
  e.preventDefault();err.textContent="";go.disabled=true;go.textContent="Opening…";
  const v=pw.value.trim();
  try{
    const html=await unlock(v);
    try{if(document.getElementById("remember").checked)localStorage.setItem(K,v);else sessionStorage.setItem(K,v);}catch(_){}
    open(html);
  }catch(_){
    err.textContent="That password isn't right. Check capital letters and dashes, and try again.";
    go.disabled=false;go.textContent="Open";
  }
});
(async()=>{let s=null;try{s=localStorage.getItem(K)||sessionStorage.getItem(K);}catch(_){}
  if(s){try{open(await unlock(s));}catch(_){try{localStorage.removeItem(K);sessionStorage.removeItem(K);}catch(__){}}}})();
