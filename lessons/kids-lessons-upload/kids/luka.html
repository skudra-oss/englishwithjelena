const PENS=['#e63946','#1d6fe0','#2a9d4a','#ffd60a','#111111','#ffffff','#7b2cbf','#f77f00','#8b5a2b','#ff7eb6','#9a9a9a'];
let i=0,col=PENS[0],er=false,drawing=false;const strokes=S.map(()=>null);const chipState=S.map(()=>({}));
const im=document.getElementById('im'),cv=document.getElementById('cv'),cx=cv.getContext('2d'),st=document.getElementById('stage');

function fit(){const w=innerWidth-16,h=innerHeight-(document.getElementById('bar').offsetHeight+16);const s=Math.min(w/1600,h/1000);st.style.width=1600*s+'px';st.style.height=1000*s+'px'}

function show(){document.getElementById('lisB').hidden=!S.some(x=>x.zones);im.src='data:image/png;base64,'+S[i].img;cx.clearRect(0,0,1600,1000);cx.globalCompositeOperation='source-over';if(strokes[i])cx.putImageData(strokes[i],0,0);document.getElementById('n').textContent=(i+1)+' / '+S.length;chips()}
function save(k){k=k??i;if(k===i)strokes[i]=cx.getImageData(0,0,1600,1000)}
function goTo(k,send){save();i=(k+S.length)%S.length;show();if(send)pub({t:'slide',i})}

let lis=false;function pen(c,b){col=c;er=false;lis=false;cv.style.cursor='';sel(b)}

function pos(e){const r=cv.getBoundingClientRect();return[Math.round((e.clientX-r.left)*1600/r.width),Math.round((e.clientY-r.top)*1000/r.height)]}
function seg(pts,c,e){if(pts.length<2)return;cx.save();cx.lineCap='round';cx.lineJoin='round';
 if(e){cx.globalCompositeOperation='destination-out';cx.lineWidth=60}else{cx.globalCompositeOperation='source-over';cx.lineWidth=12;cx.strokeStyle=c}
 cx.beginPath();cx.moveTo(pts[0][0],pts[0][1]);for(let k=1;k<pts.length;k++)cx.lineTo(pts[k][0],pts[k][1]);cx.stroke();cx.restore()}
let buf=[],last=null,timer=null;
function flush(){if(buf.length>1){pub({t:'seg',i,p:buf,c:col,e:er});buf=[buf[buf.length-1]]}}
cv.addEventListener('pointerdown',e=>{if(lis){const[x,y]=pos(e);const h=(S[i].zones||[]).find(a=>x>=a[0]&&x<=a[0]+a[2]&&y>=a[1]&&y<=a[1]+a[3]);if(h){const t=h[4].replace(/\.\.\./g,'');say(t);pub({t:'say',x:t})}return}drawing=true;try{cv.setPointerCapture(e.pointerId)}catch(_){}last=pos(e);buf=[last];timer=setInterval(flush,90)});
cv.addEventListener('pointermove',e=>{if(!drawing)return;const p=pos(e);seg([last,p],col,er);last=p;buf.push(p)});
function endDraw(){if(drawing){drawing=false;clearInterval(timer);flush();buf=[];save()}}
cv.addEventListener('pointerup',endDraw);cv.addEventListener('pointercancel',endDraw);
addEventListener('keydown',e=>{if(e.key=='ArrowRight')go(1);if(e.key=='ArrowLeft')go(-1)});

let VOICES=[];function loadV(){try{VOICES=speechSynthesis.getVoices()}catch(e){}}loadV();try{speechSynthesis.onvoiceschanged=loadV}catch(e){}
function pick(){const v=VOICES.filter(x=>x.lang&&x.lang.replace('_','-').toLowerCase().startsWith('en'));
const j=v.find(x=>/Jamie/i.test(x.name));if(j)return j;const good=v.filter(x=>/premium|enhanced|natural|neural/i.test(x.name));if(good.length)return good.find(x=>/GB/i.test(x.lang))||good[0];
for(const n of ['Google UK English Female','Google UK English Male','Serena','Kate','Daniel','Martha','Arthur','Samantha']){const f=v.find(x=>x.name.includes(n));if(f)return f}
return v.find(x=>/GB/i.test(x.lang))||v[0]}
function say(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);const v=pick();if(v){u.voice=v;u.lang=v.lang}else u.lang='en-GB';u.rate=.85;u.pitch=1.05;speechSynthesis.speak(u)}catch(e){}}

let ac=null;function tone(f,t0,d,type,vol){try{if(!ac)ac=new(window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.type=type||'sine';o.frequency.value=f;
const t=ac.currentTime+t0;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol||.3,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g).connect(ac.destination);o.start(t);o.stop(t+d+.05)}catch(e){}}
const ding=()=>{tone(880,0,.25);tone(1318,.12,.4)},boop=()=>{tone(220,0,.25,'triangle',.25);tone(165,.15,.3,'triangle',.25)},yay=()=>{[523,659,784,1047].forEach((f,n)=>tone(f,n*.13,.35));tone(1047,.55,.7,'sine',.25)};
function rnd(seed){return()=>{seed=(seed*9301+49297)%233280;return seed/233280}}
const chipEls={};
function chips(){document.querySelectorAll('.chip,.spk').forEach(c=>c.remove());const s=S[i];const k0=st.getBoundingClientRect().width/1600;
if(s.speak){s.speak.forEach(([x,y,t])=>{const bt=document.createElement('div');bt.className='spk';bt.textContent='\u{1F50A}';
bt.style.left=(x-32)*k0+'px';bt.style.top=(y-32)*k0+'px';bt.style.width=bt.style.height=64*k0+'px';bt.style.fontSize=38*k0+'px';
bt.addEventListener('pointerdown',e=>{e.stopPropagation();say(t);pub({t:'say',x:t})});st.appendChild(bt)})}
if(!s.words)return;const R=rnd(i*7+3);
const order=s.words.map((w,j)=>j).sort(()=>R()-.5);const cs=chipState[i];
const cw=Math.min(240,1600/(order.length+1)-20),ch=80;
order.forEach((j,n)=>{const c=document.createElement('div');c.className='chip';c.textContent=s.words[j];chipEls[j]=c;
c.style.width=cw*k0+'px';c.style.height=ch*k0+'px';c.style.fontSize=46*k0+'px';
const hx=(1600/(order.length+1))*(n+1)-cw/2,hy=850;
const place=(x,y)=>{const k=st.getBoundingClientRect().width/1600;c.style.left=x*k+'px';c.style.top=y*k+'px'};
c._home=()=>place(hx,hy);c._place=place;c._ok=(t)=>{c.classList.add('ok');place(t[0]-cw/2,t[1]-ch/2)};
if(cs[j]&&cs[j].ok!=null)c._ok(s.targets[cs[j].ok]);else c._home();
let dx,dy,drag=false,lastSend=0;
c.addEventListener('pointerdown',e=>{if(c.classList.contains('ok'))return;drag=true;try{c.setPointerCapture(e.pointerId)}catch(_){}dx=e.clientX-c.offsetLeft;dy=e.clientY-c.offsetTop;e.stopPropagation()});
c.addEventListener('pointermove',e=>{if(!drag)return;c.style.left=(e.clientX-dx)+'px';c.style.top=(e.clientY-dy)+'px';
 const now=Date.now();if(now-lastSend>80){lastSend=now;const k=st.getBoundingClientRect().width/1600;pub({t:'mv',i,j,x:Math.round(c.offsetLeft/k),y:Math.round(c.offsetTop/k)})}});
c.addEventListener('pointerup',e=>{if(!drag)return;drag=false;
 const k2=st.getBoundingClientRect().width/1600;const cx_=(c.offsetLeft+c.offsetWidth/2)/k2,cy_=(c.offsetTop+c.offsetHeight/2)/k2;
 const filled=s.targets.map((tt,q)=>Object.values(cs).some(v=>v.ok===q));
 let tj=s.targets.findIndex((tt,q)=>!filled[q]&&s.words[q]===s.words[j]&&Math.hypot(cx_-tt[0],cy_-tt[1])<120);
 if(tj>=0){cs[j]={ok:tj};c._ok(s.targets[tj]);ding();setTimeout(()=>say(s.words[j]),350);if(Object.keys(cs).length==s.words.length)setTimeout(yay,1300);pub({t:'ok',i,j,q:tj})}
 else{c._home();c.classList.add('shake');boop();setTimeout(()=>c.classList.remove('shake'),300);pub({t:'home',i,j})}});
st.appendChild(c)})}

const ME=Math.random().toString(36).slice(2,10);let client=null;const peers={};
function pub(m){if(!client||!client.connected)return;m.from=ME;try{client.publish(TOPIC,JSON.stringify(m))}catch(e){}}
const TOPIC='skudra-live-66e3200f6d5a1c2c/kids/'+ROOM+'/'+LESSON;
function liveUI(){const n=Object.values(peers).filter(t=>Date.now()-t<12000).length;const el=document.getElementById('live');
 el.classList.toggle('on',n>0);document.getElementById('liveT').textContent=!client||!client.connected?'offline':(n>0?'together ✓':'waiting…')}
function snapshot(){save();const out={};strokes.forEach((d,k)=>{if(!d)return;const c=document.createElement('canvas');c.width=1600;c.height=1000;c.getContext('2d').putImageData(d,0,0);
 const blank=!d.data.some((v,ix)=>ix%4==3&&v);if(!blank)out[k]=c.toDataURL('image/png')});return out}
function loadStrokes(map){Object.entries(map||{}).forEach(([k,url])=>{const img=new Image();img.onload=()=>{const c=document.createElement('canvas');c.width=1600;c.height=1000;const g=c.getContext('2d');g.drawImage(img,0,0);strokes[+k]=g.getImageData(0,0,1600,1000);if(+k===i)show()};img.src=url})}
function onMsg(m){if(!m||m.from===ME)return;peers[m.from]=Date.now();liveUI();
 if(m.t=='hello'){pub({t:'state',to:m.from,i,ink:snapshot(),chips:chipState})}
 else if(m.t=='state'&&m.to===ME&&!gotState){gotState=true;m.chips.forEach((c,k)=>chipState[k]=c||{});goTo(m.i,false);loadStrokes(m.ink)}
 else if(m.t=='slide'){goTo(m.i,false)}
 else if(m.t=='seg'){if(m.i===i){seg(m.p,m.c,m.e);save()}}
 else if(m.t=='clear'){if(m.i===i)clr(false);else strokes[m.i]=null}
 else if(m.t=='say'){say(m.x)}
 else if(m.t=='mv'&&m.i===i&&chipEls[m.j]){chipEls[m.j]._place(m.x,m.y)}
 else if(m.t=='ok'){chipState[m.i][m.j]={ok:m.q};if(m.i===i&&chipEls[m.j]){chipEls[m.j]._ok(S[i].targets[m.q]);ding();setTimeout(()=>say(S[i].words[m.j]),350);if(Object.keys(chipState[i]).length==S[i].words.length)setTimeout(yay,1300)}}
 else if(m.t=='home'&&m.i===i&&chipEls[m.j]){chipEls[m.j]._home();boop()}
}
let gotState=false;
function connect(){if(!window.mqtt)return;let test=false;try{test=localStorage.getItem('ewj-live-test')==='1'}catch(e){}
 if(!(/(^|\.)englishwithjelena\.com$/.test(location.hostname)||test))return;
