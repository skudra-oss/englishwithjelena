<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Damian's homework</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:"Trebuchet MS",Arial,sans-serif;background:#fff7e8;color:#222;min-height:100vh}
header{background:#e0457b;color:#fff;padding:14px 16px;display:flex;align-items:center;gap:12px}
header h1{margin:0;font-size:28px;flex:1}
.btn{font:inherit;font-size:22px;font-weight:bold;border:3px solid #222;border-radius:16px;background:#fff;padding:10px 18px;cursor:pointer;box-shadow:0 4px 0 #222;color:#222}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #222}
#home,#back{display:none}
main{max-width:1000px;margin:0 auto;padding:16px}
.note{background:#fff;border:2px dashed #e0457b;border-radius:14px;padding:12px 16px;font-size:16px;line-height:1.45;margin-bottom:18px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:16px}
.card{background:#fff;border:4px solid #222;border-radius:22px;padding:10px;text-align:center;cursor:pointer;box-shadow:0 5px 0 #222;user-select:none;transition:transform .1s}
.card svg{width:100%;max-width:130px;aspect-ratio:1}
.card .w{font-size:24px;font-weight:bold;min-height:30px}
.card.big .w{font-size:28px}
.topic svg{max-width:110px}
.pop{animation:pop .35s}@keyframes pop{50%{transform:scale(1.12)}}
.shake{animation:sh .35s}@keyframes sh{25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
.right{background:#b7f0b1;border-color:#2a9d4a}
.modes{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;margin:10px 0 20px}
.modes .btn{font-size:26px;padding:14px 26px}
.modes .on{background:#ffd60a}
#bar{display:flex;align-items:center;justify-content:center;gap:16px;margin-bottom:16px;font-size:26px;font-weight:bold}
#stars{letter-spacing:2px}
#done{text-align:center;font-size:44px;font-weight:bold;padding:40px 10px}
h2{text-align:center;font-size:34px;margin:6px 0 12px}
</style></head><body>
<header><h1 id="ttl"></h1><button class="btn" id="back" onclick="openTopic(cur)">&#8592;</button><button class="btn" id="home" onclick="goHome()">&#127968;</button></header>
<main id="app"></main>
<script>
const D={"name": "Damian's homework", "topics": [{"t": "Colours", "icon": "<svg viewBox=\"0 0 100 100\"><circle cx=\"50\" cy=\"50\" r=\"40\" fill=\"#e63946\" stroke=\"#333\" stroke-width=\"3\"/></svg>", "items": [{"w": "red", "say": "red", "svg": "<svg viewBox=\"0 0 100 100\"><circle cx=\"50\" cy=\"50\" r=\"40\" fill=\"#e63946\" stroke=\"#333\" stroke-width=\"3\"/></svg>"}, {"w": "green", "say": "green", "svg": "<svg viewBox=\"0 0 100 100\"><circle cx=\"50\" cy=\"50\" r=\"40\" fill=\"#2a9d4a\" stroke=\"#333\" stroke-width=\"3\"/></svg>"}, {"w": "yellow", "say": "yellow", "svg": "<svg viewBox=\"0 0 100 100\"><circle cx=\"50\" cy=\"50\" r=\"40\" fill=\"#ffd60a\" stroke=\"#333\" stroke-width=\"3\"/></svg>"}, {"w": "blue", "say": "blue", "svg": "<svg viewBox=\"0 0 100 100\"><circle cx=\"50\" cy=\"50\" r=\"40\" fill=\"#1d6fe0\" stroke=\"#333\" stroke-width=\"3\"/></svg>"}, {"w": "white", "say": "white", "svg": "<svg viewBox=\"0 0 100 100\"><circle cx=\"50\" cy=\"50\" r=\"40\" fill=\"#ffffff\" stroke=\"#888\" stroke-width=\"3\"/></svg>"}, {"w": "black", "say": "black", "svg": "<svg viewBox=\"0 0 100 100\"><circle cx=\"50\" cy=\"50\" r=\"40\" fill=\"#111111\" stroke=\"#333\" stroke-width=\"3\"/></svg>"}, {"w": "purple", "say": "purple", "svg": "<svg viewBox=\"0 0 100 100\"><circle cx=\"50\" cy=\"50\" r=\"40\" fill=\"#7b2cbf\" stroke=\"#333\" stroke-width=\"3\"/></svg>"}, {"w": "orange", "say": "orange", "svg": "<svg viewBox=\"0 0 100 100\"><circle cx=\"50\" cy=\"50\" r=\"40\" fill=\"#f77f00\" stroke=\"#333\" stroke-width=\"3\"/></svg>"}, {"w": "brown", "say": "brown", "svg": "<svg viewBox=\"0 0 100 100\"><circle cx=\"50\" cy=\"50\" r=\"40\" fill=\"#8b5a2b\" stroke=\"#333\" stroke-width=\"3\"/></svg>"}, {"w": "pink", "say": "pink", "svg": "<svg viewBox=\"0 0 100 100\"><circle cx=\"50\" cy=\"50\" r=\"40\" fill=\"#ff7eb6\" stroke=\"#333\" stroke-width=\"3\"/></svg>"}, {"w": "gray", "say": "gray", "svg": "<svg viewBox=\"0 0 100 100\"><circle cx=\"50\" cy=\"50\" r=\"40\" fill=\"#9a9a9a\" stroke=\"#333\" stroke-width=\"3\"/></svg>"}]}, {"t": "Fruit", "icon": "<svg viewBox=\"0 0 100 100\"><path d=\"M50 30 C30 18 12 34 16 56 C20 80 38 92 50 84 C62 92 80 80 84 56 C88 34 70 18 50 30Z\" fill=\"#e63946\" stroke=\"#222\" stroke-width=\"3\"/><path d=\"M50 30 L54 12\" stroke=\"#5a3d1e\" stroke-width=\"5\" stroke-linecap=\"round\"/><path d=\"M52 20 Q66 6 78 14 Q66 26 52 20Z\" fill=\"#3a9d3a\" stroke=\"#222\" stroke-width=\"2\"/></svg>", "items": [{"w": "a banana", "say": "a banana", "svg": "<svg viewBox=\"0 0 100 100\"><path d=\"M14 38 Q50 96 88 36 Q80 34 78 40 Q50 72 22 36 Q16 34 14 38Z\" fill=\"#ffd60a\" stroke=\"#222\" stroke-width=\"3\"/><path d=\"M14 38 L10 32 M88 36 L92 30\" stroke=\"#5a3d1e\" stroke-width=\"5\" stroke-linecap=\"round\"/></svg>"}, {"w": "an apple", "say": "an apple", "svg": "<svg viewBox=\"0 0 100 100\"><path d=\"M50 30 C30 18 12 34 16 56 C20 80 38 92 50 84 C62 92 80 80 84 56 C88 34 70 18 50 30Z\" fill=\"#e63946\" stroke=\"#222\" stroke-width=\"3\"/><path d=\"M50 30 L54 12\" stroke=\"#5a3d1e\" stroke-width=\"5\" stroke-linecap=\"round\"/><path d=\"M52 20 Q66 6 78 14 Q66 26 52 20Z\" fill=\"#3a9d3a\" stroke=\"#222\" stroke-width=\"2\"/></svg>"}, {"w": "an orange", "say": "an orange", "svg": "<svg viewBox=\"0 0 100 100\"><circle cx=\"50\" cy=\"56\" r=\"36\" fill=\"#f77f00\" stroke=\"#222\" stroke-width=\"3\"/><path d=\"M50 20 Q64 6 76 14 Q64 26 50 20Z\" fill=\"#3a9d3a\" stroke=\"#222\" stroke-width=\"2\"/></svg>"}, {"w": "a kiwi", "say": "a kiwi", "svg": "<svg viewBox=\"0 0 100 100\"><circle cx=\"50\" cy=\"50\" r=\"40\" fill=\"#8b5a2b\" stroke=\"#222\" stroke-width=\"3\"/><circle cx=\"50\" cy=\"50\" r=\"33\" fill=\"#7ac943\"/><circle cx=\"50\" cy=\"50\" r=\"10\" fill=\"#f3f8d0\"/><ellipse cx=\"70.0\" cy=\"50.0\" rx=\"2.5\" ry=\"4\" fill=\"#222\" transform=\"rotate(90 70.0 50.0)\"/><ellipse cx=\"67.3\" cy=\"60.0\" rx=\"2.5\" ry=\"4\" fill=\"#222\" transform=\"rotate(120 67.3 60.0)\"/><ellipse cx=\"60.0\" cy=\"67.3\" rx=\"2.5\" ry=\"4\" fill=\"#222\" transform=\"rotate(150 60.0 67.3)\"/><ellipse cx=\"50.0\" cy=\"70.0\" rx=\"2.5\" ry=\"4\" fill=\"#222\" transform=\"rotate(180 50.0 70.0)\"/><ellipse cx=\"40.0\" cy=\"67.3\" rx=\"2.5\" ry=\"4\" fill=\"#222\" transform=\"rotate(210 40.0 67.3)\"/><ellipse cx=\"32.7\" cy=\"60.0\" rx=\"2.5\" ry=\"4\" fill=\"#222\" transform=\"rotate(240 32.7 60.0)\"/><ellipse cx=\"30.0\" cy=\"50.0\" rx=\"2.5\" ry=\"4\" fill=\"#222\" transform=\"rotate(270 30.0 50.0)\"/><ellipse cx=\"32.7\" cy=\"40.0\" rx=\"2.5\" ry=\"4\" fill=\"#222\" transform=\"rotate(300 32.7 40.0)\"/><ellipse cx=\"40.0\" cy=\"32.7\" rx=\"2.5\" ry=\"4\" fill=\"#222\" transform=\"rotate(330 40.0 32.7)\"/><ellipse cx=\"50.0\" cy=\"30.0\" rx=\"2.5\" ry=\"4\" fill=\"#222\" transform=\"rotate(360 50.0 30.0)\"/><ellipse cx=\"60.0\" cy=\"32.7\" rx=\"2.5\" ry=\"4\" fill=\"#222\" transform=\"rotate(390 60.0 32.7)\"/><ellipse cx=\"67.3\" cy=\"40.0\" rx=\"2.5\" ry=\"4\" fill=\"#222\" transform=\"rotate(420 67.3 40.0)\"/></svg>"}, {"w": "an avocado", "say": "an avocado", "svg": "<svg viewBox=\"0 0 100 100\"><path d=\"M50 8 C36 8 34 30 28 44 C18 64 26 92 50 92 C74 92 82 64 72 44 C66 30 64 8 50 8Z\" fill=\"#3a7d2a\" stroke=\"#222\" stroke-width=\"3\"/><path d=\"M50 16 C40 16 40 34 35 46 C27 64 33 84 50 84 C67 84 73 64 65 46 C60 34 60 16 50 16Z\" fill=\"#cde58a\"/><circle cx=\"50\" cy=\"62\" r=\"14\" fill=\"#8b5a2b\" stroke=\"#222\" stroke-width=\"2\"/></svg>"}, {"w": "a lemon", "say": "a lemon", "svg": "<svg viewBox=\"0 0 100 100\"><path d=\"M8 50 Q16 42 22 40 Q50 18 78 40 Q84 42 92 50 Q84 58 78 60 Q50 82 22 60 Q16 58 8 50Z\" fill=\"#fff04d\" stroke=\"#222\" stroke-width=\"3\"/></svg>"}, {"w": "a coconut", "say": "a coconut", "svg": "<svg viewBox=\"0 0 100 100\"><circle cx=\"50\" cy=\"50\" r=\"40\" fill=\"#7a4a24\" stroke=\"#222\" stroke-width=\"3\"/><circle cx=\"40\" cy=\"40\" r=\"5\" fill=\"#3d240f\"/><circle cx=\"60\" cy=\"40\" r=\"5\" fill=\"#3d240f\"/><circle cx=\"50\" cy=\"56\" r=\"5\" fill=\"#3d240f\"/></svg>"}, {"w": "a plum", "say": "a plum", "svg": "<svg viewBox=\"0 0 100 100\"><ellipse cx=\"50\" cy=\"58\" rx=\"34\" ry=\"36\" fill=\"#7b2cbf\" stroke=\"#222\" stroke-width=\"3\"/><path d=\"M50 26 Q42 50 48 90\" fill=\"none\" stroke=\"#4b1a78\" stroke-width=\"3\"/><ellipse cx=\"36\" cy=\"46\" rx=\"5\" ry=\"8\" fill=\"#fff\" opacity=\".6\"/><path d=\"M50 24 L54 8\" stroke=\"#5a3d1e\" stroke-width=\"5\" stroke-linecap=\"round\"/><path d=\"M54 14 Q68 2 78 10 Q68 20 54 14Z\" fill=\"#3a9d3a\" stroke=\"#222\" stroke-width=\"2\"/></svg>"}]}, {"t": "How are you?", "icon": "<svg viewBox=\"0 0 100 100\"><circle cx=\"50\" cy=\"50\" r=\"40\" fill=\"#ffd166\" stroke=\"#222\" stroke-width=\"3\"/><circle cx=\"36\" cy=\"42\" r=\"5\" fill=\"#222\"/><circle cx=\"64\" cy=\"42\" r=\"5\" fill=\"#222\"/><path d=\"M30 58 Q50 82 70 58 Z\" fill=\"#b5323f\" stroke=\"#222\" stroke-width=\"3\"/></svg>", "items": [{"w": "happy", "say": "I'm happy", "svg": "<svg viewBox=\"0 0 100 100\"><circle cx=\"50\" cy=\"50\" r=\"40\" fill=\"#ffd166\" stroke=\"#222\" stroke-width=\"3\"/><circle cx=\"36\" cy=\"42\" r=\"5\" fill=\"#222\"/><circle cx=\"64\" cy=\"42\" r=\"5\" fill=\"#222\"/><path d=\"M30 58 Q50 82 70 58 Z\" fill=\"#b5323f\" stroke=\"#222\" stroke-width=\"3\"/></svg>"}, {"w": "good", "say": "I'm good", "svg": "<svg viewBox=\"0 0 100 100\"><circle cx=\"50\" cy=\"50\" r=\"40\" fill=\"#c6f0c2\" stroke=\"#222\" stroke-width=\"3\"/><circle cx=\"36\" cy=\"42\" r=\"5\" fill=\"#222\"/><circle cx=\"64\" cy=\"42\" r=\"5\" fill=\"#222\"/><path d=\"M32 60 Q50 74 68 60\" fill=\"none\" stroke=\"#222\" stroke-width=\"4\" stroke-linecap=\"round\"/></svg>"}, {"w": "OK", "say": "I'm OK", "svg": "<svg viewBox=\"0 0 100 100\"><circle cx=\"50\" cy=\"50\" r=\"40\" fill=\"#e6e6e6\" stroke=\"#222\" stroke-width=\"3\"/><circle cx=\"36\" cy=\"42\" r=\"5\" fill=\"#222\"/><circle cx=\"64\" cy=\"42\" r=\"5\" fill=\"#222\"/><line x1=\"34\" y1=\"64\" x2=\"66\" y2=\"64\" stroke=\"#222\" stroke-width=\"4\" stroke-linecap=\"round\"/></svg>"}, {"w": "sad", "say": "I'm sad", "svg": "<svg viewBox=\"0 0 100 100\"><circle cx=\"50\" cy=\"50\" r=\"40\" fill=\"#8fd3ff\" stroke=\"#222\" stroke-width=\"3\"/><circle cx=\"36\" cy=\"42\" r=\"5\" fill=\"#222\"/><circle cx=\"64\" cy=\"42\" r=\"5\" fill=\"#222\"/><path d=\"M32 70 Q50 56 68 70\" fill=\"none\" stroke=\"#222\" stroke-width=\"4\" stroke-linecap=\"round\"/></svg>"}, {"w": "tired", "say": "I'm tired", "svg": "<svg viewBox=\"0 0 100 100\"><circle cx=\"50\" cy=\"50\" r=\"40\" fill=\"#dcc8f0\" stroke=\"#222\" stroke-width=\"3\"/><line x1=\"29\" y1=\"43\" x2=\"43\" y2=\"43\" stroke=\"#222\" stroke-width=\"4\"/><line x1=\"57\" y1=\"43\" x2=\"71\" y2=\"43\" stroke=\"#222\" stroke-width=\"4\"/><ellipse cx=\"50\" cy=\"66\" rx=\"5\" ry=\"7\" fill=\"none\" stroke=\"#222\" stroke-width=\"3\"/></svg>"}, {"w": "angry", "say": "I'm angry", "svg": "<svg viewBox=\"0 0 100 100\"><circle cx=\"50\" cy=\"50\" r=\"40\" fill=\"#ff8f8f\" stroke=\"#222\" stroke-width=\"3\"/><circle cx=\"36\" cy=\"42\" r=\"5\" fill=\"#222\"/><circle cx=\"64\" cy=\"42\" r=\"5\" fill=\"#222\"/><line x1=\"28\" y1=\"30\" x2=\"44\" y2=\"38\" stroke=\"#222\" stroke-width=\"4\"/><line x1=\"72\" y1=\"30\" x2=\"56\" y2=\"38\" stroke=\"#222\" stroke-width=\"4\"/><path d=\"M32 70 Q50 56 68 70\" fill=\"none\" stroke=\"#222\" stroke-width=\"4\" stroke-linecap=\"round\"/></svg>"}]}]};
document.getElementById('ttl').textContent=D.name;
let VOICES=[];function loadV(){try{VOICES=speechSynthesis.getVoices()}catch(e){}}try{loadV();speechSynthesis.onvoiceschanged=loadV}catch(e){}
function pick(){const v=VOICES.filter(x=>x.lang&&x.lang.replace('_','-').toLowerCase().startsWith('en'));
const good=v.filter(x=>/premium|enhanced|natural|neural/i.test(x.name));if(good.length)return good.find(x=>/GB/i.test(x.lang))||good[0];
for(const n of ['Google UK English Female','Google UK English Male','Serena','Kate','Daniel','Martha','Arthur','Samantha']){const f=v.find(x=>x.name.includes(n));if(f)return f}
return v.find(x=>/GB/i.test(x.lang))||v[0]}
function say(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);const v=pick();if(v){u.voice=v;u.lang=v.lang}else u.lang='en-GB';u.rate=.8;u.pitch=1.05;speechSynthesis.speak(u)}catch(e){}}
let ac=null;function tone(f,t0,d,type,vol){try{if(!ac)ac=new(window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.type=type||'sine';o.frequency.value=f;
const t=ac.currentTime+t0;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol||.3,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g).connect(ac.destination);o.start(t);o.stop(t+d+.05)}catch(e){}}
const ding=()=>{tone(880,0,.25);tone(1318,.12,.4)},boop=()=>{tone(220,0,.25,'triangle',.25);tone(165,.15,.3,'triangle',.25)},
yay=()=>{[523,659,784,1047].forEach((f,n)=>tone(f,n*.13,.35));tone(1047,.55,.8,'sine',.25)};
const app=document.getElementById('app');let cur=0;
function anim(el,c){el.classList.remove(c);void el.offsetWidth;el.classList.add(c)}
function goHome(){document.getElementById('home').style.display='none';document.getElementById('back').style.display='none';
app.innerHTML=`<div class="note"><b>Для родителей.</b> Выберите тему. <b>&#128066; Listen</b>: ребёнок нажимает на картинку, слышит слово и повторяет его вслух. <b>&#127919; Find it</b>: компьютер говорит слово, ребёнок находит картинку (&#128266; повторяет слово ещё раз). Лучше понемногу каждый день, 5 минут. Включите звук.</div><div class="grid" id="g"></div>`;
D.topics.forEach((t,k)=>{const c=document.createElement('div');c.className='card topic big';c.innerHTML=t.icon+`<div class="w">${t.t}</div>`;c.onclick=()=>openTopic(k);g.appendChild(c)})}
function openTopic(k,mode){cur=k;const t=D.topics[k];document.getElementById('home').style.display='inline-block';document.getElementById('back').style.display='none';
app.innerHTML=`<h2>${t.t}</h2><div class="modes"><button class="btn ${mode=='find'?'':'on'}" onclick="openTopic(${k})">&#128066; Listen</button><button class="btn ${mode=='find'?'on':''}" onclick="startFind(${k})">&#127919; Find it</button></div><div id="bar"></div><div class="grid" id="g"></div>`;
if(mode=='find')return;
t.items.forEach(it=>{const c=document.createElement('div');c.className='card';c.innerHTML=it.svg+`<div class="w">${it.w}</div>`;c.onclick=()=>{anim(c,'pop');say(it.say)};g.appendChild(c)})}
let F=null;
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function startFind(k){openTopic(k,'find');F={k,round:0,stars:0,total:Math.min(8,D.topics[k].items.length*2),last:null};nextRound()}
function nextRound(){const t=D.topics[F.k];const bar=document.getElementById('bar'),g=document.getElementById('g');
if(F.round>=F.total){g.innerHTML='';bar.innerHTML='';yay();say('Well done!');
g.outerHTML=`<div id="done">&#11088; Well done! &#11088;<br><span style="font-size:60px">${'&#11088;'.repeat(F.stars)}</span><br><br><button class="btn" onclick="startFind(${F.k})">&#128257; Again</button></div>`;return}
let pool=t.items.filter(x=>x!==F.last);const target=pool[Math.floor(Math.random()*pool.length)];F.last=target;
const show=shuffle([target,...shuffle(t.items.filter(x=>x!==target)).slice(0,Math.min(5,t.items.length-1))]);
bar.innerHTML=`<button class="btn" id="rep">&#128266;</button><span id="stars">${'&#11088;'.repeat(F.stars)}</span>`;
document.getElementById('rep').onclick=()=>say(target.say);
g.innerHTML='';let tries=0;
show.forEach(it=>{const c=document.createElement('div');c.className='card';c.innerHTML=it.svg;c.onclick=()=>{
 if(it===target){c.classList.add('right');ding();if(tries==0)F.stars++;F.round++;setTimeout(()=>say(it.say),350);setTimeout(nextRound,1700)}
 else{tries++;anim(c,'shake');boop();setTimeout(()=>say(target.say),500)}};g.appendChild(c)});
setTimeout(()=>say(target.say),300)}
goHome();
</script></body></html>
