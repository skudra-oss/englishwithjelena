<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Luka's homework</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:"Trebuchet MS",Arial,sans-serif;background:#fff7e8;color:#222;min-height:100vh}
header{background:#e0457b;color:#fff;padding:14px 16px;display:flex;align-items:center;gap:12px}
header h1{margin:0;font-size:28px;flex:1}
.btn{font:inherit;font-size:22px;font-weight:bold;border:3px solid #222;border-radius:16px;background:#fff;padding:10px 18px;cursor:pointer;box-shadow:0 4px 0 #222;color:#222}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #222}
#home,#back{display:none}
main{max-width:1000px;margin:0 auto;padding:16px}
.note{background:#fff;border:2px dashed #e0457b;border-radius:14px;padding:12px 16px;font-size:16px;line-height:1.45;margin-bottom:18px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:16px}
.card{background:#fff;border:4px solid #222;border-radius:22px;padding:10px;text-align:center;cursor:pointer;box-shadow:0 5px 0 #222;user-select:none;transition:transform .1s}
.card svg{width:100%;max-width:130px;aspect-ratio:1}
.card .w{font-size:24px;font-weight:bold;min-height:30px}
.card.big .w{font-size:28px}
.topic svg{max-width:110px}
.pop{animation:pop .35s}@keyframes pop{50%{transform:scale(1.12)}}
.shake{animation:sh .35s}@keyframes sh{25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
.right{background:#b7f0b1;border-color:#2a9d4a}
.modes{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;margin:10px 0 20px}
.modes .btn{font-size:26px;padding:14px 26px}
.modes .on{background:#ffd60a}
#bar{display:flex;align-items:center;justify-content:center;gap:16px;margin-bottom:16px;font-size:26px;font-weight:bold}
#stars{letter-spacing:2px}
#done{text-align:center;font-size:44px;font-weight:bold;padding:40px 10px}
h2{text-align:center;font-size:34px;margin:6px 0 12px}
</style></head><body>
<header><h1 id="ttl"></h1><button class="btn" id="back" onclick="openTopic(cur)">&#8592;</button><button class="btn" id="home" onclick="goHome()">&#127968;</button></header>
<main id="app"></main>
<script>
const D={"name": "Luka's homework", "topics": [{"t": "Colours", "icon": "<svg viewBox=\"0 0 100 100\"><circle cx=\"50\" cy=\"50\" r=\"40\" fill=\"#1d6fe0\" stroke=\"#333\" stroke-width=\"3\"/></svg>", "items": [{"w": "red", "say": "red", "svg": "<svg viewBox=\"0 0 100 100\"><circle cx=\"50\" cy=\"50\" r=\"40\" fill=\"#e63946\" stroke=\"#333\" stroke-width=\"3\"/></svg>"}, {"w": "green", "say": "green", "svg": "<svg viewBox=\"0 0 100 100\"><circle cx=\"50\" cy=\"50\" r=\"40\" fill=\"#2a9d4a\" stroke=\"#333\" stroke-width=\"3\"/></svg>"}, {"w": "yellow", "say": "yellow", "svg": "<svg viewBox=\"0 0 100 100\"><circle cx=\"50\" cy=\"50\" r=\"40\" fill=\"#ffd60a\" stroke=\"#333\" stroke-width=\"3\"/></svg>"}, {"w": "blue", "say": "blue", "svg": "<svg viewBox=\"0 0 100 100\"><circle cx=\"50\" cy=\"50\" r=\"40\" fill=\"#1d6fe0\" stroke=\"#333\" stroke-width=\"3\"/></svg>"}]}, {"t": "Numbers", "icon": "<svg viewBox=\"0 0 100 100\"><text x=\"50\" y=\"62\" font-size=\"58\" font-weight=\"bold\" text-anchor=\"middle\" fill=\"#7b2cbf\" font-family=\"Arial\">5</text><circle cx=\"14\" cy=\"78\" r=\"5\" fill=\"#7b2cbf\"/><circle cx=\"32\" cy=\"78\" r=\"5\" fill=\"#7b2cbf\"/><circle cx=\"50\" cy=\"78\" r=\"5\" fill=\"#7b2cbf\"/><circle cx=\"68\" cy=\"78\" r=\"5\" fill=\"#7b2cbf\"/><circle cx=\"86\" cy=\"78\" r=\"5\" fill=\"#7b2cbf\"/></svg>", "items": [{"w": "one", "say": "one", "svg": "<svg viewBox=\"0 0 100 100\"><text x=\"50\" y=\"62\" font-size=\"58\" font-weight=\"bold\" text-anchor=\"middle\" fill=\"#e63946\" font-family=\"Arial\">1</text><circle cx=\"14\" cy=\"78\" r=\"5\" fill=\"#e63946\"/></svg>"}, {"w": "two", "say": "two", "svg": "<svg viewBox=\"0 0 100 100\"><text x=\"50\" y=\"62\" font-size=\"58\" font-weight=\"bold\" text-anchor=\"middle\" fill=\"#1d6fe0\" font-family=\"Arial\">2</text><circle cx=\"14\" cy=\"78\" r=\"5\" fill=\"#1d6fe0\"/><circle cx=\"32\" cy=\"78\" r=\"5\" fill=\"#1d6fe0\"/></svg>"}, {"w": "three", "say": "three", "svg": "<svg viewBox=\"0 0 100 100\"><text x=\"50\" y=\"62\" font-size=\"58\" font-weight=\"bold\" text-anchor=\"middle\" fill=\"#2a9d4a\" font-family=\"Arial\">3</text><circle cx=\"14\" cy=\"78\" r=\"5\" fill=\"#2a9d4a\"/><circle cx=\"32\" cy=\"78\" r=\"5\" fill=\"#2a9d4a\"/><circle cx=\"50\" cy=\"78\" r=\"5\" fill=\"#2a9d4a\"/></svg>"}, {"w": "four", "say": "four", "svg": "<svg viewBox=\"0 0 100 100\"><text x=\"50\" y=\"62\" font-size=\"58\" font-weight=\"bold\" text-anchor=\"middle\" fill=\"#f77f00\" font-family=\"Arial\">4</text><circle cx=\"14\" cy=\"78\" r=\"5\" fill=\"#f77f00\"/><circle cx=\"32\" cy=\"78\" r=\"5\" fill=\"#f77f00\"/><circle cx=\"50\" cy=\"78\" r=\"5\" fill=\"#f77f00\"/><circle cx=\"68\" cy=\"78\" r=\"5\" fill=\"#f77f00\"/></svg>"}, {"w": "five", "say": "five", "svg": "<svg viewBox=\"0 0 100 100\"><text x=\"50\" y=\"62\" font-size=\"58\" font-weight=\"bold\" text-anchor=\"middle\" fill=\"#7b2cbf\" font-family=\"Arial\">5</text><circle cx=\"14\" cy=\"78\" r=\"5\" fill=\"#7b2cbf\"/><circle cx=\"32\" cy=\"78\" r=\"5\" fill=\"#7b2cbf\"/><circle cx=\"50\" cy=\"78\" r=\"5\" fill=\"#7b2cbf\"/><circle cx=\"68\" cy=\"78\" r=\"5\" fill=\"#7b2cbf\"/><circle cx=\"86\" cy=\"78\" r=\"5\" fill=\"#7b2cbf\"/></svg>"}, {"w": "six", "say": "six", "svg": "<svg viewBox=\"0 0 100 100\"><text x=\"50\" y=\"62\" font-size=\"58\" font-weight=\"bold\" text-anchor=\"middle\" fill=\"#e63946\" font-family=\"Arial\">6</text><circle cx=\"14\" cy=\"78\" r=\"5\" fill=\"#e63946\"/><circle cx=\"32\" cy=\"78\" r=\"5\" fill=\"#e63946\"/><circle cx=\"50\" cy=\"78\" r=\"5\" fill=\"#e63946\"/><circle cx=\"68\" cy=\"78\" r=\"5\" fill=\"#e63946\"/><circle cx=\"86\" cy=\"78\" r=\"5\" fill=\"#e63946\"/><circle cx=\"14\" cy=\"90\" r=\"5\" fill=\"#e63946\"/></svg>"}, {"w": "seven", "say": "seven", "svg": "<svg viewBox=\"0 0 100 100\"><text x=\"50\" y=\"62\" font-size=\"58\" font-weight=\"bold\" text-anchor=\"middle\" fill=\"#1d6fe0\" font-family=\"Arial\">7</text><circle cx=\"14\" cy=\"78\" r=\"5\" fill=\"#1d6fe0\"/><circle cx=\"32\" cy=\"78\" r=\"5\" fill=\"#1d6fe0\"/><circle cx=\"50\" cy=\"78\" r=\"5\" fill=\"#1d6fe0\"/><circle cx=\"68\" cy=\"78\" r=\"5\" fill=\"#1d6fe0\"/><circle cx=\"86\" cy=\"78\" r=\"5\" fill=\"#1d6fe0\"/><circle cx=\"14\" cy=\"90\" r=\"5\" fill=\"#1d6fe0\"/><circle cx=\"32\" cy=\"90\" r=\"5\" fill=\"#1d6fe0\"/></svg>"}, {"w": "eight", "say": "eight", "svg": "<svg viewBox=\"0 0 100 100\"><text x=\"50\" y=\"62\" font-size=\"58\" font-weight=\"bold\" text-anchor=\"middle\" fill=\"#2a9d4a\" font-family=\"Arial\">8</text><circle cx=\"14\" cy=\"78\" r=\"5\" fill=\"#2a9d4a\"/><circle cx=\"32\" cy=\"78\" r=\"5\" fill=\"#2a9d4a\"/><circle cx=\"50\" cy=\"78\" r=\"5\" fill=\"#2a9d4a\"/><circle cx=\"68\" cy=\"78\" r=\"5\" fill=\"#2a9d4a\"/><circle cx=\"86\" cy=\"78\" r=\"5\" fill=\"#2a9d4a\"/><circle cx=\"14\" cy=\"90\" r=\"5\" fill=\"#2a9d4a\"/><circle cx=\"32\" cy=\"90\" r=\"5\" fill=\"#2a9d4a\"/><circle cx=\"50\" cy=\"90\" r=\"5\" fill=\"#2a9d4a\"/></svg>"}, {"w": "nine", "say": "nine", "svg": "<svg viewBox=\"0 0 100 100\"><text x=\"50\" y=\"62\" font-size=\"58\" font-weight=\"bold\" text-anchor=\"middle\" fill=\"#f77f00\" font-family=\"Arial\">9</text><circle cx=\"14\" cy=\"78\" r=\"5\" fill=\"#f77f00\"/><circle cx=\"32\" cy=\"78\" r=\"5\" fill=\"#f77f00\"/><circle cx=\"50\" cy=\"78\" r=\"5\" fill=\"#f77f00\"/><circle cx=\"68\" cy=\"78\" r=\"5\" fill=\"#f77f00\"/><circle cx=\"86\" cy=\"78\" r=\"5\" fill=\"#f77f00\"/><circle cx=\"14\" cy=\"90\" r=\"5\" fill=\"#f77f00\"/><circle cx=\"32\" cy=\"90\" r=\"5\" fill=\"#f77f00\"/><circle cx=\"50\" cy=\"90\" r=\"5\" fill=\"#f77f00\"/><circle cx=\"68\" cy=\"90\" r=\"5\" fill=\"#f77f00\"/></svg>"}, {"w": "ten", "say": "ten", "svg": "<svg viewBox=\"0 0 100 100\"><text x=\"50\" y=\"62\" font-size=\"58\" font-weight=\"bold\" text-anchor=\"middle\" fill=\"#7b2cbf\" font-family=\"Arial\">10</text><circle cx=\"14\" cy=\"78\" r=\"5\" fill=\"#7b2cbf\"/><circle cx=\"32\" cy=\"78\" r=\"5\" fill=\"#7b2cbf\"/><circle cx=\"50\" cy=\"78\" r=\"5\" fill=\"#7b2cbf\"/><circle cx=\"68\" cy=\"78\" r=\"5\" fill=\"#7b2cbf\"/><circle cx=\"86\" cy=\"78\" r=\"5\" fill=\"#7b2cbf\"/><circle cx=\"14\" cy=\"90\" r=\"5\" fill=\"#7b2cbf\"/><circle cx=\"32\" cy=\"90\" r=\"5\" fill=\"#7b2cbf\"/><circle cx=\"50\" cy=\"90\" r=\"5\" fill=\"#7b2cbf\"/><circle cx=\"68\" cy=\"90\" r=\"5\" fill=\"#7b2cbf\"/><circle cx=\"86\" cy=\"90\" r=\"5\" fill=\"#7b2cbf\"/></svg>"}]}, {"t": "My letters", "icon": "<svg viewBox=\"0 0 100 100\"><rect x=\"8\" y=\"8\" width=\"84\" height=\"84\" rx=\"14\" fill=\"#fff\" stroke=\"#e63946\" stroke-width=\"5\"/><text x=\"50\" y=\"68\" font-size=\"50\" font-weight=\"bold\" text-anchor=\"middle\" fill=\"#e63946\" font-family=\"Arial\">Ll</text></svg>", "items": [{"w": "L", "say": "L.", "svg": "<svg viewBox=\"0 0 100 100\"><rect x=\"8\" y=\"8\" width=\"84\" height=\"84\" rx=\"14\" fill=\"#fff\" stroke=\"#e63946\" stroke-width=\"5\"/><text x=\"50\" y=\"68\" font-size=\"50\" font-weight=\"bold\" text-anchor=\"middle\" fill=\"#e63946\" font-family=\"Arial\">Ll</text></svg>"}, {"w": "U", "say": "U.", "svg": "<svg viewBox=\"0 0 100 100\"><rect x=\"8\" y=\"8\" width=\"84\" height=\"84\" rx=\"14\" fill=\"#fff\" stroke=\"#1d6fe0\" stroke-width=\"5\"/><text x=\"50\" y=\"68\" font-size=\"50\" font-weight=\"bold\" text-anchor=\"middle\" fill=\"#1d6fe0\" font-family=\"Arial\">Uu</text></svg>"}, {"w": "K", "say": "K.", "svg": "<svg viewBox=\"0 0 100 100\"><rect x=\"8\" y=\"8\" width=\"84\" height=\"84\" rx=\"14\" fill=\"#fff\" stroke=\"#2a9d4a\" stroke-width=\"5\"/><text x=\"50\" y=\"68\" font-size=\"50\" font-weight=\"bold\" text-anchor=\"middle\" fill=\"#2a9d4a\" font-family=\"Arial\">Kk</text></svg>"}, {"w": "A", "say": "A.", "svg": "<svg viewBox=\"0 0 100 100\"><rect x=\"8\" y=\"8\" width=\"84\" height=\"84\" rx=\"14\" fill=\"#fff\" stroke=\"#f77f00\" stroke-width=\"5\"/><text x=\"50\" y=\"68\" font-size=\"50\" font-weight=\"bold\" text-anchor=\"middle\" fill=\"#f77f00\" font-family=\"Arial\">Aa</text></svg>"}]}, {"t": "I am ...", "icon": "<svg viewBox=\"0 0 100 100\"><circle cx=\"50\" cy=\"50\" r=\"40\" fill=\"#ffd166\" stroke=\"#222\" stroke-width=\"3\"/><circle cx=\"36\" cy=\"42\" r=\"5\" fill=\"#222\"/><circle cx=\"64\" cy=\"42\" r=\"5\" fill=\"#222\"/><path d=\"M30 58 Q50 82 70 58 Z\" fill=\"#b5323f\" stroke=\"#222\" stroke-width=\"3\"/></svg>", "items": [{"w": "I am good.", "say": "I am good.", "svg": "<svg viewBox=\"0 0 100 100\"><circle cx=\"50\" cy=\"50\" r=\"40\" fill=\"#ffd166\" stroke=\"#222\" stroke-width=\"3\"/><circle cx=\"36\" cy=\"42\" r=\"5\" fill=\"#222\"/><circle cx=\"64\" cy=\"42\" r=\"5\" fill=\"#222\"/><path d=\"M32 60 Q50 74 68 60\" fill=\"none\" stroke=\"#222\" stroke-width=\"4\" stroke-linecap=\"round\"/></svg>"}, {"w": "I am not so good.", "say": "I am not so good.", "svg": "<svg viewBox=\"0 0 100 100\"><circle cx=\"50\" cy=\"50\" r=\"40\" fill=\"#8fd3ff\" stroke=\"#222\" stroke-width=\"3\"/><circle cx=\"36\" cy=\"42\" r=\"5\" fill=\"#222\"/><circle cx=\"64\" cy=\"42\" r=\"5\" fill=\"#222\"/><path d=\"M32 70 Q50 56 68 70\" fill=\"none\" stroke=\"#222\" stroke-width=\"4\" stroke-linecap=\"round\"/></svg>"}, {"w": "I am 7.", "say": "I am seven.", "svg": "<svg viewBox=\"0 0 100 100\"><text x=\"50\" y=\"62\" font-size=\"58\" font-weight=\"bold\" text-anchor=\"middle\" fill=\"#1d6fe0\" font-family=\"Arial\">7</text><circle cx=\"14\" cy=\"78\" r=\"5\" fill=\"#1d6fe0\"/><circle cx=\"32\" cy=\"78\" r=\"5\" fill=\"#1d6fe0\"/><circle cx=\"50\" cy=\"78\" r=\"5\" fill=\"#1d6fe0\"/><circle cx=\"68\" cy=\"78\" r=\"5\" fill=\"#1d6fe0\"/><circle cx=\"86\" cy=\"78\" r=\"5\" fill=\"#1d6fe0\"/><circle cx=\"14\" cy=\"90\" r=\"5\" fill=\"#1d6fe0\"/><circle cx=\"32\" cy=\"90\" r=\"5\" fill=\"#1d6fe0\"/></svg>"}, {"w": "Hello!", "say": "Hello!", "svg": "<svg viewBox=\"0 0 100 100\"><text x=\"50\" y=\"66\" font-size=\"56\" text-anchor=\"middle\">\ud83d\udc4b</text></svg>"}]}]};
document.getElementById('ttl').textContent=D.name;
let VOICES=[];function loadV(){try{VOICES=speechSynthesis.getVoices()}catch(e){}}try{loadV();speechSynthesis.onvoiceschanged=loadV}catch(e){}
function pick(){const v=VOICES.filter(x=>x.lang&&x.lang.replace('_','-').toLowerCase().startsWith('en'));
const good=v.filter(x=>/premium|enhanced|natural|neural/i.test(x.name));if(good.length)return good.find(x=>/GB/i.test(x.lang))||good[0];
for(const n of ['Google UK English Female','Google UK English Male','Serena','Kate','Daniel','Martha','Arthur','Samantha']){const f=v.find(x=>x.name.includes(n));if(f)return f}
return v.find(x=>/GB/i.test(x.lang))||v[0]}
function say(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);const v=pick();if(v){u.voice=v;u.lang=v.lang}else u.lang='en-GB';u.rate=.8;u.pitch=1.05;speechSynthesis.speak(u)}catch(e){}}
let ac=null;function tone(f,t0,d,type,vol){try{if(!ac)ac=new(window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.type=type||'sine';o.frequency.value=f;
const t=ac.currentTime+t0;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol||.3,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g).connect(ac.destination);o.start(t);o.stop(t+d+.05)}catch(e){}}
const ding=()=>{tone(880,0,.25);tone(1318,.12,.4)},boop=()=>{tone(220,0,.25,'triangle',.25);tone(165,.15,.3,'triangle',.25)},
yay=()=>{[523,659,784,1047].forEach((f,n)=>tone(f,n*.13,.35));tone(1047,.55,.8,'sine',.25)};
const app=document.getElementById('app');let cur=0;
function anim(el,c){el.classList.remove(c);void el.offsetWidth;el.classList.add(c)}
function goHome(){document.getElementById('home').style.display='none';document.getElementById('back').style.display='none';
app.innerHTML=`<div class="note"><b>Для родителей.</b> Выберите тему. <b>&#128066; Listen</b>: ребёнок нажимает на картинку, слышит слово и повторяет его вслух. <b>&#127919; Find it</b>: компьютер говорит слово, ребёнок находит картинку (&#128266; повторяет слово ещё раз). Лучше понемногу каждый день, 5 минут. Включите звук.</div><div class="grid" id="g"></div>`;
D.topics.forEach((t,k)=>{const c=document.createElement('div');c.className='card topic big';c.innerHTML=t.icon+`<div class="w">${t.t}</div>`;c.onclick=()=>openTopic(k);g.appendChild(c)})}
function openTopic(k,mode){cur=k;const t=D.topics[k];document.getElementById('home').style.display='inline-block';document.getElementById('back').style.display='none';
app.innerHTML=`<h2>${t.t}</h2><div class="modes"><button class="btn ${mode=='find'?'':'on'}" onclick="openTopic(${k})">&#128066; Listen</button><button class="btn ${mode=='find'?'on':''}" onclick="startFind(${k})">&#127919; Find it</button></div><div id="bar"></div><div class="grid" id="g"></div>`;
if(mode=='find')return;
t.items.forEach(it=>{const c=document.createElement('div');c.className='card';c.innerHTML=it.svg+`<div class="w">${it.w}</div>`;c.onclick=()=>{anim(c,'pop');say(it.say)};g.appendChild(c)})}
let F=null;
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function startFind(k){openTopic(k,'find');F={k,round:0,stars:0,total:Math.min(8,D.topics[k].items.length*2),last:null};nextRound()}
function nextRound(){const t=D.topics[F.k];const bar=document.getElementById('bar'),g=document.getElementById('g');
if(F.round>=F.total){g.innerHTML='';bar.innerHTML='';yay();say('Well done!');
g.outerHTML=`<div id="done">&#11088; Well done! &#11088;<br><span style="font-size:60px">${'&#11088;'.repeat(F.stars)}</span><br><br><button class="btn" onclick="startFind(${F.k})">&#128257; Again</button></div>`;return}
let pool=t.items.filter(x=>x!==F.last);const target=pool[Math.floor(Math.random()*pool.length)];F.last=target;
const show=shuffle([target,...shuffle(t.items.filter(x=>x!==target)).slice(0,Math.min(5,t.items.length-1))]);
bar.innerHTML=`<button class="btn" id="rep">&#128266;</button><span id="stars">${'&#11088;'.repeat(F.stars)}</span>`;
document.getElementById('rep').onclick=()=>say(target.say);
g.innerHTML='';let tries=0;
show.forEach(it=>{const c=document.createElement('div');c.className='card';c.innerHTML=it.svg;c.onclick=()=>{
 if(it===target){c.classList.add('right');ding();if(tries==0)F.stars++;F.round++;setTimeout(()=>say(it.say),350);setTimeout(nextRound,1700)}
 else{tries++;anim(c,'shake');boop();setTimeout(()=>say(target.say),500)}};g.appendChild(c)});
setTimeout(()=>say(target.say),300)}
goHome();
</script></body></html>
