<style>
:root{--bg:#e5eaf0;--surface:#fff;--ink:#1c2531;--muted:#596575;--line:#d2dae4;--chalk:#22583f;--pencil:#f2b200;--rubber:#c2414f;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#121821;--surface:#1b2430;--ink:#e8eef5;--muted:#a0adbd;--line:#314050;--chalk:#3b8c68;--pencil:#f6c33a;--rubber:#f08a95;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:16px/1.45 "Atkinson Hyperlegible","Segoe UI",Arial,sans-serif;padding:24px max(16px,env(safe-area-inset-left,0px))}
form{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:24px;max-width:380px;width:100%;display:flex;flex-direction:column;gap:12px}
h1{font-family:"Baloo 2","Trebuchet MS",sans-serif;font-size:28px;line-height:1.1;margin:0}
p{margin:0;color:var(--muted)}
label{font-weight:700}
input[type=password],input[type=text]{width:100%;font:inherit;font-size:18px;padding:10px 12px;border:2px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink)}
input:focus-visible,button:focus-visible{outline:3px solid var(--pencil);outline-offset:2px}
.row{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--muted)}
button{font:inherit;font-weight:700;border:0;border-radius:10px;padding:12px;background:var(--chalk);color:#fff;cursor:pointer}
button:disabled{opacity:.6}
.err{color:var(--rubber);font-weight:700;min-height:1.4em}
</style>

const b=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function unlock(pw){
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b(DATA.s),iterations:600000,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
  const plain=await crypto.subtle.decrypt({name:"AES-GCM",iv:b(DATA.i)},key,b(DATA.d));
  return new TextDecoder().decode(plain);
}
function open(html){document.open();document.write(html);document.close();}
const f=document.getElementById("f"),pw=document.getElementById("pw"),err=document.getElementById("err"),go=document.getElementById("go");
document.getElementById("show").addEventListener("change",e=>pw.type=e.target.checked?"text":"password");
f.addEventListener("submit",async e=>{
  e.preventDefault();err.textContent="";go.disabled=true;go.textContent="Opening…";
  try{
    const html=await unlock(pw.value.trim());
    try{if(document.getElementById("remember").checked)localStorage.setItem("kitchen-pw",pw.value.trim());}catch(_){}
    open(html);
  }catch(_){
    err.textContent="That password isn't right. Check capital letters and dashes, and try again.";
    go.disabled=false;go.textContent="Open the lesson";
  }
});
(async()=>{let s=null;try{s=localStorage.getItem("kitchen-pw");}catch(_){}
  if(s){try{open(await unlock(s));}catch(_){try{localStorage.removeItem("kitchen-pw");}catch(__){}}}})();
</script>
