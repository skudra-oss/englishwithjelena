<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>In the house · Nastja</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--pink:#ff5d8f;--orange:#ff9a3c;--gold:#ffc93c;--ink:#3a2340;--bg1:#fff0f5;--bg2:#fff6e5}
*{box-sizing:border-box}
body{margin:0;font-family:Nunito,"Trebuchet MS",Arial,sans-serif;color:var(--ink);background:linear-gradient(160deg,var(--bg1),var(--bg2) 60%,#fffbe6);min-height:100vh}
header{background:linear-gradient(90deg,var(--pink),var(--orange),var(--gold));color:#fff;padding:20px 20px 24px;text-align:center;border-radius:0 0 28px 28px;box-shadow:0 6px 18px rgba(255,93,143,.25)}
header h1{margin:0;font-size:clamp(26px,5vw,40px);font-weight:900;text-shadow:0 2px 0 rgba(0,0,0,.12)}
header p{margin:6px 0 0;font-size:17px}
header a.back{display:inline-block;margin-bottom:6px;color:#fff;font-weight:800;text-decoration:none;font-size:16px;background:rgba(255,255,255,.25);padding:4px 12px;border-radius:14px}
#plainBtn{position:fixed;top:10px;right:10px;z-index:9;border:2px solid #fff;background:rgba(255,255,255,.25);color:#fff;font-weight:800;border-radius:20px;padding:6px 12px;cursor:pointer;font-size:14px;font-family:inherit}
main{max-width:1000px;margin:0 auto;padding:10px 14px 50px}
nav{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:18px 10px 6px}
nav button{border:none;border-radius:22px;padding:10px 18px;font-size:17px;font-weight:800;cursor:pointer;background:#fff;color:var(--pink);box-shadow:0 3px 0 #ffc2d6;font-family:inherit}
nav button.on{background:var(--pink);color:#fff;box-shadow:0 3px 0 #c93d6b}
section{display:none} section.on{display:block}
h2{text-align:center;margin:16px 0 6px;font-size:26px}
h3{margin:22px 4px 10px;font-size:21px;color:var(--orange)}
.hint{text-align:center;margin:0 0 14px;font-size:16px;opacity:.8}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.card{background:#fff;border-radius:20px;padding:10px 10px 12px;text-align:center;cursor:pointer;box-shadow:0 4px 0 #ffd7a8,0 8px 18px rgba(255,154,60,.15);border:3px solid transparent;transition:transform .12s}
.card:hover{transform:translateY(-3px)} .card.say{border-color:var(--gold)}
.ph{height:120px;display:flex;align-items:center;justify-content:center}
.ph img{max-width:100%;max-height:120px;border-radius:12px}
.ph svg{width:100%;height:110px}
.word{font-size:22px;font-weight:900;margin-top:6px;color:var(--pink)}
.ru{font-size:14px;opacity:.7;display:none} body.showru .ru{display:block}
.toggle{text-align:center;margin-bottom:6px}
.toggle label{background:#fff;padding:6px 14px;border-radius:16px;font-size:15px;cursor:pointer}
.panel{background:#fff;border-radius:24px;padding:18px;box-shadow:0 6px 18px rgba(255,154,60,.18);max-width:760px;margin:0 auto}
.big{display:block;margin:0 auto 14px;border:none;border-radius:30px;padding:14px 26px;font-size:22px;font-weight:900;cursor:pointer;color:#fff;background:linear-gradient(90deg,var(--pink),var(--orange));box-shadow:0 4px 0 #c93d6b;font-family:inherit}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.opt{background:#fffaf2;border:3px solid #ffe2bd;border-radius:18px;padding:8px;cursor:pointer;height:150px;display:flex;align-items:center;justify-content:center}
.opt img{max-width:100%;max-height:130px;border-radius:10px} .opt svg{width:100%;height:120px}
.opt.ok{border-color:#3cc47c;background:#eafff2} .opt.no{border-color:#ff5d5d;background:#fff0f0}
.score{text-align:center;font-size:18px;font-weight:800;margin:10px 0 0}
.tt{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
.tcard{background:#fff;border-radius:22px;padding:14px;text-align:center;cursor:pointer;box-shadow:0 4px 0 #ffc2d6,0 8px 18px rgba(255,93,143,.15)}
.tword{font-size:34px;font-weight:900} .tword.near{color:var(--pink)} .tword.far{color:var(--orange)}
.scene{display:flex;align-items:center;height:120px;margin:8px 0;gap:4px;background:linear-gradient(#fff,#fff7e8);border-radius:14px;padding:6px;overflow:hidden}
.me{font-size:52px;line-height:1;flex:none}
.arrow{height:6px;background:var(--ink);border-radius:3px;position:relative;flex:none;margin-right:14px}
.arrow:after{content:"";position:absolute;right:-12px;top:-7px;border-left:14px solid var(--ink);border-top:10px solid transparent;border-bottom:10px solid transparent}
.arrow.far{flex:1 1 auto;min-width:60px;max-width:220px}
.thing{flex:none;display:flex;align-items:center;justify-content:center}
.thing svg{width:100%;height:100%}
.sent{font-size:20px;font-weight:700}
.tag{display:inline-block;font-size:13px;padding:3px 10px;border-radius:10px;background:var(--bg1);margin:2px}
.rule{background:#fff;border-radius:20px;padding:14px 18px;margin:18px auto 0;max-width:640px;font-size:17px}
.rule table{width:100%;border-collapse:collapse;text-align:center} .rule td,.rule th{padding:8px;border-bottom:2px dashed #ffd7a8}
.qscene{justify-content:center;height:160px}
.btns{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:12px}
.btns button{border:none;border-radius:18px;padding:14px;font-size:24px;font-weight:900;cursor:pointer;background:#fff4dc;color:var(--ink);box-shadow:0 4px 0 #ffd27a;font-family:inherit}
.btns button.ok{background:#3cc47c;color:#fff;box-shadow:0 4px 0 #23915a} .btns button.no{background:#ff7a7a;color:#fff;box-shadow:0 4px 0 #c94a4a}
.feedback{text-align:center;font-size:22px;font-weight:800;min-height:34px;margin-top:10px}
.next{display:none}
.topics{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:18px;margin-top:20px}
.topic{display:block;background:#fff;border-radius:24px;padding:16px;text-align:center;text-decoration:none;color:var(--ink);box-shadow:0 5px 0 #ffd7a8,0 10px 22px rgba(255,154,60,.18);transition:transform .12s}
.topic:hover{transform:translateY(-4px)}
.topic .pic{height:150px;display:flex;align-items:center;justify-content:center}
.topic .pic img{max-width:100%;max-height:150px;border-radius:14px} .topic .pic svg{height:140px;width:100%}
.topic b{display:block;font-size:24px;margin-top:8px;color:var(--pink)}
.topic span{font-size:15px;opacity:.75}
body.plain{background:#fff}
body.plain header{background:#fff;color:#222;box-shadow:none;border-bottom:2px solid #ddd;border-radius:0}
body.plain header h1{text-shadow:none} body.plain header a.back{color:#333;background:#eee}
body.plain #plainBtn{color:#333;border-color:#999;background:#f3f3f3}
body.plain .card,body.plain .tcard,body.plain .panel,body.plain .rule,body.plain .topic{box-shadow:none;border:2px solid #ddd}
body.plain .word,body.plain .tword,body.plain .topic b,body.plain h3{color:#222}
body.plain nav button{box-shadow:none;border:2px solid #ccc;color:#333} body.plain nav button.on{background:#333;color:#fff}
body.plain .big{background:#333;box-shadow:none} body.plain .scene{background:#fafafa}
</style></head>
<body>
<button id="plainBtn" onclick="document.body.classList.toggle('plain');try{localStorage.setItem('nastja-plain',document.body.classList.contains('plain')?'1':'')}catch(e){}">Plain view</button>
<script>try{if(localStorage.getItem('nastja-plain'))document.body.classList.add('plain')}catch(e){}</script>
<header><a class="back" href="./">← All topics</a><h1>🏠 In the house</h1><p>Tap a picture to hear the word</p></header>
<nav><button class="on" data-s="words">📖 Words</button><button data-s="g1">🎧 Listen and tap</button></nav>

</main>

"#eeeeee\"/></g></svg>", "ru": "\u043e\u043a\u043d\u043e", "pl": false}]}, {"g": "Inside the house", "items": [{"w": "armchair", "p": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 70 62\" overflow=\"visible\"><g stroke=\"#4a3b33\" stroke-width=\"1.6\" stroke-linejoin=\"round\"><rect x=\"8\" y=\"4\" width=\"54\" height=\"34\" rx=\"10\" fill=\"#66bb6a\"/><rect x=\"10\" y=\"30\" width=\"50\" height=\"18\" rx=\"6\" fill=\"#a5d6a7\"/><rect x=\"1\" y=\"20\" width=\"16\" height=\"32\" rx=\"7\" fill=\"#66bb6a\"/><rect x=\"53\" y=\"20\" width=\"16\" height=\"32\" rx=\"7\" fill=\"#66bb6a\"/><rect x=\"9\" y=\"52\" width=\"5\" height=\"9\" fill=\"#6d4c41\"/><rect x=\"56\" y=\"52\" width=\"5\" height=\"9\" fill=\"#6d4c41\"/></g></svg>", "ru": "\u043a\u0440\u0435\u0441\u043b\u043e", "pl": false}, {"w": "bath", "p": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 120 60\" overflow=\"visible\"><path d=\"M14 14 V5 Q14 1 20 1 H28 V7\" fill=\"none\" stroke=\"#90a4ae\" stroke-width=\"3\"/><g fill=\"#e1f5fe\" stroke=\"#81d4fa\" stroke-width=\"1\"><circle cx=\"42\" cy=\"13\" r=\"6\"/><circle cx=\"54\" cy=\"9\" r=\"8\"/><circle cx=\"68\" cy=\"12\" r=\"5\"/><circle cx=\"80\" cy=\"9\" r=\"7\"/><circle cx=\"92\" cy=\"13\" r=\"5\"/></g><g stroke=\"#4a3b33\" stroke-width=\"1.6\" stroke-linejoin=\"round\"><rect x=\"2\" y=\"14\" width=\"116\" height=\"8\" rx=\"4\" fill=\"#fff\"/><path d=\"M6 22 H114 V30 Q114 50 92 50 H28 Q6 50 6 30 Z\" fill=\"#fff\"/><circle cx=\"24\" cy=\"54\" r=\"4\" fill=\"#ffca28\"/><circle cx=\"96\" cy=\"54\" r=\"4\" fill=\"#ffca28\"/></g><path d=\"M10 25 H110\" stroke=\"#4fc3f7\" stroke-width=\"3\"/></svg>", "ru": "\u0432\u0430\u043d\u043d\u0430", "pl": false}, {"w": "bed", "p": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 130 64\" overflow=\"visible\"><g stroke=\"#4a3b33\" stroke-width=\"1.6\" stroke-linejoin=\"round\"><rect x=\"0\" y=\"0\" width=\"12\" height=\"64\" rx=\"3\" fill=\"#8d6e63\"/><rect x=\"122\" y=\"22\" width=\"8\" height=\"42\" rx=\"2\" fill=\"#8d6e63\"/><rect x=\"6\" y=\"36\" width=\"120\" height=\"18\" fill=\"#a1887f\"/><rect x=\"10\" y=\"26\" width=\"114\" height=\"14\" rx=\"4\" fill=\"#fff\"/><rect x=\"44\" y=\"22\" width=\"84\" height=\"22\" rx=\"6\" fill=\"#64b5f6\"/><ellipse cx=\"28\" cy=\"24\" rx=\"15\" ry=\"8\" fill=\"#fff\"/><rect x=\"10\" y=\"54\" width=\"6\" height=\"10\" fill=\"#6d4c41\"/><rect x=\"116\" y=\"54\" width=\"6\" height=\"10\" fill=\"#6d4c41\"/></g></svg>", "ru": "\u043a\u0440\u043e\u0432\u0430\u0442\u044c", "pl": false}, {"w": "chair", "p": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 44 66\" overflow=\"visible\"><g stroke=\"#4a3b33\" stroke-width=\"1.6\" stroke-linejoin=\"round\"><rect x=\"4\" y=\"0\" width=\"8\" height=\"42\" rx=\"3\" fill=\"#ffb74d\"/><rect x=\"6\" y=\"42\" width=\"5\" height=\"24\" fill=\"#e69138\"/><rect x=\"33\" y=\"42\" width=\"5\" height=\"24\" fill=\"#e69138\"/><rect x=\"4\" y=\"34\" width=\"36\" height=\"8\" rx=\"3\" fill=\"#ffb74d\"/></g></svg>", "ru": "\u0441\u0442\u0443\u043b", "pl": false}, {"w": "desk", "p": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 96 62\" overflow=\"visible\"><g stroke=\"#4a3b33\" stroke-width=\"1.6\" stroke-linejoin=\"round\"><rect x=\"4\" y=\"15\" width=\"7\" height=\"47\" fill=\"#795548\"/><rect x=\"60\" y=\"15\" width=\"32\" height=\"47\" fill=\"#a1887f\"/><line x1=\"60\" y1=\"31\" x2=\"92\" y2=\"31\"/><line x1=\"60\" y1=\"47\" x2=\"92\" y2=\"47\"/><rect x=\"0\" y=\"6\" width=\"96\" height=\"9\" rx=\"2\" fill=\"#8d6e63\"/></g><g fill=\"#4e342e\"><circle cx=\"76\" cy=\"23\" r=\"2\"/><circle cx=\"76\" cy=\"39\" r=\"2\"/><circle cx=\"76\" cy=\"55\" r=\"2\"/></g></svg>", "ru": "\u043f\u0438\u0441\u044c\u043c\u0435\u043d\u043d\u044b\u0439 \u0441\u0442\u043e\u043b", "pl": false}, {"w": "fridge", "p": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 58 150\" overflow=\"visible\"><g stroke=\"#4a3b33\" stroke-width=\"1.6\" stroke-linejoin=\"round\"><rect x=\"2\" y=\"2\" width=\"54\" height=\"146\" rx=\"7\" fill=\"#e3f2fd\"/><line x1=\"2\" y1=\"52\" x2=\"56\" y2=\"52\"/><rect x=\"45\" y=\"18\" width=\"5\" height=\"22\" rx=\"2\" fill=\"#90a4ae\"/><rect x=\"45\" y=\"62\" width=\"5\" height=\"36\" rx=\"2\" fill=\"#90a4ae\"/></g><circle cx=\"16\" cy=\"76\" r=\"4\" fill=\"#ef5350\"/><circle cx=\"26\" cy=\"86\" r=\"4\" fill=\"#ffca28\"/></svg>", "ru": "\u0445\u043e\u043b\u043e\u0434\u0438\u043b\u044c\u043d\u0438\u043a", "pl": false}, {"w": "sofa", "p": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 134 64\" overflow=\"visible\"><g stroke=\"#4a3b33\" stroke-width=\"1.6\" stroke-linejoin=\"round\"><rect x=\"10\" y=\"4\" width=\"114\" height=\"32\" rx=\"12\" fill=\"#e57373\"/><rect x=\"12\" y=\"30\" width=\"55\" height=\"20\" rx=\"6\" fill=\"#ef9a9a\"/><rect x=\"67\" y=\"30\" width=\"55\" height=\"20\" rx=\"6\" fill=\"#ef9a9a\"/><rect x=\"0\" y=\"20\" width=\"20\" height=\"34\" rx=\"9\" fill=\"#e57373\"/><rect x=\"114\" y=\"20\" width=\"20\" height=\"34\" rx=\"9\" fill=\"#e57373\"/><rect x=\"10\" y=\"54\" width=\"6\" height=\"10\" fill=\"#6d4c41\"/><rect x=\"118\" y=\"54\" width=\"6\" height=\"10\" fill=\"#6d4c41\"/></g></svg>", "ru": "\u0434\u0438\u0432\u0430\u043d", "pl": false}, {"w": "table", "p": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 96 52\" overflow=\"visible\"><g stroke=\"#4a3b33\" stroke-width=\"1.6\" stroke-linejoin=\"round\"><rect x=\"8\" y=\"15\" width=\"7\" height=\"37\" fill=\"#8d6e63\"/><rect x=\"81\" y=\"15\" width=\"7\" height=\"37\" fill=\"#8d6e63\"/><rect x=\"0\" y=\"6\" width=\"96\" height=\"9\" rx=\"3\" fill=\"#a1887f\"/></g></svg>", "ru": "\u0441\u0442\u043e\u043b", "pl": false}, {"w": "wardrobe", "p": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 70 124\" overflow=\"visible\"><g stroke=\"#4a3b33\" stroke-width=\"1.6\" stroke-linejoin=\"round\"><rect x=\"2\" y=\"2\" width=\"66\" height=\"114\" rx=\"4\" fill=\"#a1887f\"/><rect x=\"0\" y=\"0\" width=\"70\" height=\"8\" rx=\"3\" fill=\"#8d6e63\"/><line x1=\"35\" y1=\"8\" x2=\"35\" y2=\"116\"/><rect x=\"7\" y=\"14\" width=\"23\" height=\"96\" rx=\"2\" fill=\"none\"/><rect x=\"40\" y=\"14\" width=\"23\" height=\"96\" rx=\"2\" fill=\"none\"/><rect x=\"6\" y=\"116\" width=\"6\" height=\"8\" fill=\"#6d4c41\"/><rect x=\"58\" y=\"116\" width=\"6\" height=\"8\" fill=\"#6d4c41\"/></g><g fill=\"#4e342e\"><circle cx=\"30\" cy=\"62\" r=\"2.5\"/><circle cx=\"40\" cy=\"62\" r=\"2.5\"/></g></svg>", "ru": "\u0448\u043a\u0430\u0444 \u0434\u043b\u044f \u043e\u0434\u0435\u0436\u0434\u044b", "pl": false}]}];

let voice=null;
function pickVoice(){const vs=speechSynthesis.getVoices();
 voice=vs.find(v=>/en-GB/i.test(v.lang)&&/female|Serena|Kate|Libby|Sonia|Martha|Stephanie|Google UK English Female/i.test(v.name))
  ||vs.find(v=>/en-GB/i.test(v.lang))||vs.find(v=>/^en/i.test(v.lang))||null;}
try{pickVoice();speechSynthesis.onvoiceschanged=pickVoice;}catch(e){}
function say(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);if(voice)u.voice=voice;u.lang='en-GB';u.rate=.82;speechSynthesis.speak(u);}catch(e){}}
const pic=p=>p.startsWith('<svg')?p:`<img src="${p}" alt="">`;
const ALL=G.flatMap(g=>g.items);
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{
 document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x===b));
 document.querySelectorAll('section').forEach(s=>s.classList.toggle('on',s.id===b.dataset.s));
 if(b.dataset.s==='g1'&&!g1cur)g1new(); if(b.dataset.s==='g2'&&!g2cur)g2new();});
const wordsEl=document.getElementById('wordlist');
G.forEach(g=>{const h=document.createElement('h3');h.textContent=g.g;wordsEl.appendChild(h);
 const grid=document.createElement('div');grid.className='grid';wordsEl.appendChild(grid);
 g.items.forEach(o=>{const c=document.createElement('div');c.className='card';
  c.innerHTML=`<div class="ph">${pic(o.p)}</div><div class="word">${o.w}</div><div class="ru">${o.ru}</div><div>🔊</div>`;
  c.onclick=()=>{say(o.w);c.classList.add('say');setTimeout(()=>c.classList.remove('say'),700)};grid.appendChild(c);});});
const shuffle=a=>a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(x=>x[1]);
let g1cur=null,g1ok=0,g1tot=0,g1lock=false,g1last=null;
function g1new(){g1lock=false;const pool=ALL.filter(o=>o!==g1last);g1cur=pool[Math.floor(Math.random()*pool.length)];g1last=g1cur;
 const opts=shuffle([g1cur,...shuffle(ALL.filter(o=>o!==g1cur&&!(o.x&&g1cur.x))).slice(0,3)]);
 const box=document.getElementById('g1opts');box.innerHTML='';
 opts.forEach(o=>{const d=document.createElement('div');d.className='opt';d.innerHTML=pic(o.p);
  d.onclick=()=>{if(g1lock)return;
   if(o===g1cur){g1lock=true;d.classList.add('ok');g1ok++;g1tot++;say('Yes! '+o.w);setTimeout(g1new,1300);}
   else{d.classList.add('no');g1tot++;say(o.w);}
   document.getElementById('g1score').textContent=`⭐ ${g1ok} / ${g1tot}`;};box.appendChild(d);});
 setTimeout(()=>say(g1cur.w),300);}
document.getElementById('g1play').onclick=()=>g1cur&&say(g1cur.w);


</script></body></html>
