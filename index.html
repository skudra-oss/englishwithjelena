<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title> English teacher</title>
<meta name="description" content="Online English lessons for children, teens and adults, built around your interests.">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="64x64" href="favicon-64.png">
<link rel="icon" type="image/png" sizes="192x192" href="favicon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Prata&family=Caveat:wght@500;700&family=Manrope:wght@400;500;600;700&display=swap&subset=cyrillic">
<link rel="stylesheet" href="style.css">
<script>try{var t=localStorage.getItem("theme");if(t==="dark"||t==="light")document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
</head>
<body data-page="home">
</head>
<body data-page="home">

<header>
  <div class="wrap bar">
    <a class="logo" href="index.html">Jelena Skudra<span>.</span></a>
    <nav class="links" aria-label="Main">
      <a href="./#directions" data-t="nav.lessons">Lessons</a>
      <a href="prices.html" class="price-nav" data-t="nav.prices">Prices</a>
      <a href="/lessons/" data-t="nav.boards">Lesson examples</a>
      <a href="reviews.html" data-t="nav.reviews">Reviews</a>
      <a href="about.html" data-t="nav.about">About me</a>
    </nav>
    <div class="lang" role="group" aria-label="Language">
      <button type="button" id="lang-ru" data-lang="ru" aria-pressed="false">RU</button>
      <button type="button" id="lang-en" data-lang="en" aria-pressed="true">EN</button>
    </div>
    <button type="button" class="theme-btn" id="theme-btn" aria-label="Day / night theme" title="Day / night theme">
      <svg class="i-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
      <svg class="i-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.6M12 18.9v2.6M2.5 12h2.6M18.9 12h2.6M5.3 5.3l1.8 1.8M16.9 16.9l1.8 1.8M5.3 18.7l1.8-1.8M16.9 7.1l1.8-1.8"/></svg>
    </button>
    <a class="btn btn-hl btn-sm" href="book.html" data-t="nav.book">Book a lesson</a>
  </div>
</header>

<main id="top">
  <div class="hero">
    <div class="wrap hero-grid">
      <div>
        <p class="eyebrow" data-t="front.eyebrow"></p>
        <h1 data-t="hero.title" data-mark></h1>
        <p class="subtitle" data-t="front.subtitle"></p>
        <p class="lead" data-t="front.text"></p>
        <ul class="facts2" id="facts2"></ul>
      </div>
      <div class="hero-photo">
        <p class="margin-note" lang="en"><s id="m-wrong"></s><span id="m-right"></span></p>
        <div class="photo-row">
        <figure class="photo">
          <svg class="pin" viewBox="0 0 40 48" aria-hidden="true"><path class="pin-needle" d="M20 26v18"/><circle class="pin-head" cx="20" cy="16" r="11"/><path class="pin-shine" d="M14 12c1-3 3-4 6-4"/></svg>
          <picture>
            <source srcset="jelena.webp" type="image/webp">
            <img src="jelena.jpg" width="900" height="1200" data-t-alt="front.photoAlt" alt="Jelena Skudra">
          </picture>
        </figure>
        <svg class="bigben" viewBox="0 0 130 300" aria-hidden="true">
            <path class="star" d="M100 14l3.4 7 7.6 1.1-5.5 5.3 1.3 7.6-6.8-3.6-6.8 3.6 1.3-7.6-5.5-5.3 7.6-1.1z"/>
            <path d="M70 6v18M63 24h14M58 62l12-38 12 38"/>
            <path d="M56 62h28v30H56zM62 70v14M70 70v14M78 70v14M54 92h32"/>
            <path d="M52 92h36v52H52z"/><circle cx="70" cy="118" r="14"/><circle cx="70" cy="118" r="1.5"/>
            <path d="M70 118v-9M70 118l7 4"/>
            <path d="M54 144h32v134H54zM62 152v118M70 152v118M78 152v118M54 186h32M54 228h32"/>
            <path d="M40 278h62M34 290h80"/>
            <path d="M14 278c-6-6-4-16 4-18-2-9 8-15 14-9 5-6 15-2 13 6 7 1 8 12 1 15-1 6-9 8-13 5"/>
            <path d="M26 278v-14M26 266l-5-6M26 270l5-5"/>
          </svg>
        </div>
        <p class="hand-tag" lang="en">English that works <u>with</u> your brain</p>
      </div>
      <div class="cta cta-wide">
        <a class="btn btn-hl btn-lg" href="book.html" data-t="front.bookButton"></a>
        <a class="btn btn-line btn-lg" href="prices.html" data-t="front.pricesButton"></a>
        <a class="btn btn-line btn-lg" href="about.html#lesson" data-t="front.moreButton"></a>
      </div>
    </div>
  </div>

  <section id="directions">
    <div class="wrap">
      <div class="sec-head"><h2 data-t="front.directions.title"></h2></div>
      <div class="dir-grid" id="dir-list"></div>
    </div>
  </section>

  <section id="lesson" class="alt">
    <div class="wrap lesson-grid">
      <div class="lesson-main">
        <h2 data-t="front.how.title"></h2>
        <p class="lesson-lead" data-t="front.how.text"></p>
        <ul class="how-points" id="how-points"></ul>
        <p class="lang-note" data-t="front.how.langNote"></p>
        <a class="btn btn-line" href="about.html#lesson" data-t="front.how.button"></a>
      </div>
      <aside class="lesson-side">
        <figure class="example notebook tape-top">
          <p class="eyebrow" data-t="lesson.exampleLabel"></p>
          <blockquote data-t="lesson.example"></blockquote>
          <svg class="smile" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="17"/><path d="M14 15v2M26 15v2M12 23c4 6 12 6 16 0"/></svg>
        </figure>
        <p class="teacher-note" lang="en"><svg class="note-arrow" viewBox="0 0 60 70" aria-hidden="true"><path d="M52 64C24 60 10 40 12 8"/><path d="M5 17l7-10 7 9"/></svg><span data-t="front.how.note"></span></p>
      </aside>
    </div>
  </section>

  <section id="peek">
    <div class="wrap">
      <div class="sec-head peek-head"><h2 data-t="front.peek.title"></h2><p class="try-note" lang="en"><span data-t="front.peek.tryNote"></span><svg class="try-arrow" viewBox="0 0 80 50" aria-hidden="true"><path d="M4 6c34-2 54 12 58 38"/><path d="M53 37l9 8 7-10"/></svg></p></div>
      <p class="sec-lead" data-t="front.peek.text"></p>
      <div class="peek-grid" id="peek-list"></div>
      <p class="more-link"><a href="/lessons/" data-t="front.peek.all"></a></p>
    </div>
  </section>

  <section id="home-reviews" class="alt">
    <div class="wrap">
      <div class="sec-head"><h2 data-t="front.reviewsTitle"></h2></div>
      <div class="reviews three" id="home-reviews-list"></div>
      <p class="more-link"><a href="reviews.html" data-t="front.reviewsAll"></a></p>
    </div>
  </section>

  <section id="extras">
    <div class="wrap duo">
      <article class="card tape-top">
        <p class="eyebrow" data-t="word.label"></p>
        <p class="word" data-t="word.word"></p>
        <p class="origin" data-t="word.origin"></p>
        <p class="story" data-t="word.story"></p>
        <p class="word-more" id="word-more-box"><a id="word-more" target="_blank" rel="noopener" data-t="front.wordMore"></a></p>
      </article>
      <article class="club">
        <p class="soon-tag" data-t="front.club.title"></p>
        <p data-t="front.club.text"></p>
        <a class="btn btn-hl" id="club-btn" target="_blank" rel="noopener" data-t="front.club.button"></a>
        <p class="club-note" data-t="front.club.note"></p>
      </article>
    </div>
  </section>

  <section class="band cta-band">
    <div class="wrap after-pay">
      <div><h2 class="h-sm" data-t="front.start.title"></h2><p data-t="front.start.text"></p></div>
      <div class="cta"><a class="btn btn-hl" href="book.html" data-t="front.start.book"></a><a class="btn btn-line light" href="prices.html" data-t="front.start.prices"></a></div>
    </div>
  </section>
</main>

<footer>
  <div class="wrap foot">
    <span>© <span id="year">2026</span> Jelena Skudra</span>
    <nav class="foot-links" aria-label="More">
      <a href="test.html" data-t="front.footer.test">Level test and questions</a>
      <a href="payment.html" data-t="front.footer.payment">Payment</a>
      <a href="book.html#contact-box" data-t="front.footer.contacts">Contacts</a>
    </nav>
    <div class="profiles" id="profiles"></div>
  </div>
</footer>

<script src="content.js"></script>
<script src="site.js"></script>
</body>
</html>
