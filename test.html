<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jelena Skudra · English teacher</title>
<meta name="description" content="Online English lessons with Jelena Skudra for children, teens and adults, built around your interests.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23454192'/%3E%3Crect x='14' y='38' width='36' height='10' fill='%23E06C9F'/%3E%3Ctext x='32' y='44' font-family='Georgia,serif' font-size='34' font-weight='700' fill='%23fff' text-anchor='middle'%3EJ%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Prata&family=Caveat:wght@500;700&family=Manrope:wght@400;500;600;700&display=swap&subset=cyrillic">
<link rel="stylesheet" href="style.css">
<script>try{var t=localStorage.getItem("theme");if(t==="dark"||t==="light")document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
</head>
<body data-page="test">

<header>
  <div class="wrap bar">
    <a class="logo" href="index.html">Jelena Skudra<span>.</span></a>
    <nav class="links" aria-label="Main">
      <a href="./#directions" data-t="nav.lessons">Lessons</a>
      <a href="prices.html" class="price-nav" data-t="nav.prices">Prices</a>
      <a href="/lessons/" data-t="nav.boards">Lesson examples</a>
      <a href="reviews.html" data-t="nav.reviews">Reviews</a>
      <a href="about.html" data-t="nav.about">About me</a>
    </nav>
    <div class="lang" role="group" aria-label="Language">
      <button type="button" id="lang-ru" data-lang="ru" aria-pressed="false">RU</button>
      <button type="button" id="lang-en" data-lang="en" aria-pressed="true">EN</button>
    </div>
    <button type="button" class="theme-btn" id="theme-btn" aria-label="Day / night theme" title="Day / night theme">
      <svg class="i-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
      <svg class="i-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.6M12 18.9v2.6M2.5 12h2.6M18.9 12h2.6M5.3 5.3l1.8 1.8M16.9 16.9l1.8 1.8M5.3 18.7l1.8-1.8M16.9 7.1l1.8-1.8"/></svg>
    </button>
    <a class="btn btn-hl btn-sm" href="book.html" data-t="nav.book">Book a lesson</a>
  </div>
</header>

<main id="top">
  <section class="page-head">
    <div class="wrap">
      <h1 data-t="pages.test.title"></h1>
      <p class="lead" data-t="pages.test.lead"></p>
    </div>
  </section>

  <section id="test" class="page-body">
    <div class="wrap test-grid">
      <div class="sec-head">
        <p class="eyebrow" data-t="test.eyebrow"></p>
        <h2 data-t="test.title"></h2>
        <p data-t="test.text"></p>
      </div>
      <div class="quiz" id="quiz" aria-live="polite"></div>
    </div>
  </section>

  <section id="levels">
    <div class="wrap">
      <div class="sec-head"><h2 data-t="levels.title"></h2><p data-t="levels.text"></p></div>
      <div class="levels" id="levels-list"></div>
    </div>
  </section>

  <section id="faq" class="alt">
    <div class="wrap narrow">
      <div class="sec-head"><h2 data-t="faq.title"></h2></div>
      <div class="faq" id="faq-list"></div>
    </div>
  </section>
</main>

<footer>
  <div class="wrap foot">
    <span>© <span id="year">2026</span> Jelena Skudra</span>
    <nav class="foot-links" aria-label="More">
      <a href="test.html" data-t="front.footer.test">Level test and questions</a>
      <a href="payment.html" data-t="front.footer.payment">Payment</a>
      <a href="book.html#contact-box" data-t="front.footer.contacts">Contacts</a>
    </nav>
    <div class="profiles" id="profiles"></div>
  </div>
</footer>

<script src="content.js"></script>
<script src="site.js"></script>
</body>
</html>
